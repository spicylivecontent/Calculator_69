name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        # Sedan API 37 publiceras plattformarna med minor-suffix (android-37.0).
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Debug APK
        id: build_apk
        run: |
          set -o pipefail
          # assembleDebugAndroidTest kompilerar UI-testerna också, så att stavfel och
          # API-fel där upptäcks direkt i det snabba jobbet (emulatorjobbet kör dem sedan).
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease --stacktrace --console=plain 2>&1 | tee gradle-build.log

      - name: Report Gradle failure details
        if: failure() && steps.build_apk.outcome == 'failure'
        run: |
          TESTDIR=app/build/test-results/testDebugUnitTest
          {
            echo "## Gradle build failure details"
            echo
            echo '```text'
            grep -E '(^e: | error: |FAILURE: Build failed|What went wrong:|Execution failed for task|Could not resolve|Could not find)' gradle-build.log | tail -n 50 || tail -n 80 gradle-build.log
            echo '```'
            echo
            echo "## Enhetstester"
            echo
            echo '```text'
            if [ -d "$TESTDIR" ]; then
              grep -h '<testsuite ' "$TESTDIR"/*.xml | head -n 20 || true
              grep -h -B1 '<failure' "$TESTDIR"/*.xml | head -n 40 || true
            else
              echo "Inga testresultat hittades."
            fi
            echo '```'
            echo
            echo "## Testrader ur loggen"
            echo
            echo '```text'
            grep -E 'FAILED|AssertionError|ComparisonFailure|expected:' gradle-build.log | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Korta annotations så att felen syns direkt i check-run-fliken.
          # Loggens sista rader följer alltid med: konfigurations- och
          # beroenderesolveringsfel ("Execution failed", "Could not resolve")
          # matchar inte mönstren ovan och syns annars bara i den fullständiga loggen.
          {
            grep -E '^e: ' gradle-build.log | head -n 8
            if [ -d "$TESTDIR" ]; then
              grep -h -B1 '<failure' "$TESTDIR"/*.xml | head -n 20
            fi
            grep -E 'FAILED|AssertionError|ComparisonFailure|expected:' gradle-build.log | head -n 20
            tail -n 30 gradle-build.log
          } | awk '!seen[$0]++' | head -n 48 | while IFS= read -r line; do
            line=${line//'%'/'%25'}
            line=${line//$'\r'/'%0D'}
            echo "::error title=Gradle diagnostic::$line"
          done

      - name: Visa lintfel som annotations
        if: failure()
        run: |
          python3 - <<'PYLINT'
          import os
          import xml.etree.ElementTree as ET
          path = "app/build/reports/lint-results-debug.xml"
          if os.path.exists(path):
              for issue in ET.parse(path).getroot().findall("issue"):
                  if issue.get("severity") not in ("Error", "Fatal"):
                      continue
                  message = issue.get("message", "").replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D")
                  location = issue.find("location")
                  where = ""
                  if location is not None:
                      file = os.path.relpath(location.get("file", ""))
                      where = ",file=" + file + ",line=" + location.get("line", "1")
                  print("::error title=Android lint" + where + "::" + issue.get("id", "") + ": " + message)
          PYLINT

      - name: Kontrollera APK-storleken
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s "$APK")
          echo "APK: $((SIZE / 1024 / 1024)) MB ($SIZE byte)"
          if [ "$SIZE" -gt 41943040 ]; then
            echo "::error title=APK för stor::APK:n är $((SIZE / 1024 / 1024)) MB, taket är 40 MB"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Spara enhets- och lintresultat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-and-lint-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-debug.*
            app/schemas/**/*.json
            app/build/outputs/mapping/release/**
            gradle-build.log
          if-no-files-found: ignore
          retention-days: 14
