name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        # Sedan API 37 publiceras plattformarna med minor-suffix (android-37.0).
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Debug APK
        id: build_apk
        run: |
          set -o pipefail
          # assembleDebugAndroidTest kompilerar UI-testerna också, så att stavfel och
          # API-fel där upptäcks direkt i det snabba jobbet (emulatorjobbet kör dem sedan).
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease --stacktrace --console=plain 2>&1 | tee gradle-build.log

      - name: Report Gradle failure details
        if: failure() && steps.build_apk.outcome == 'failure'
        run: |
          TESTDIR=app/build/test-results/testDebugUnitTest
          # Plocka ut fallerande/felande tester med stack-spår ur JUnit-XML:en.
          python3 - <<'PYTEST' > /tmp/testfailures.txt || true
          import glob, html, re
          import xml.etree.ElementTree as ET

          seen = set()
          for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for tc in root.iter('testcase'):
                  bad = tc.find('failure')
                  if bad is None:
                      bad = tc.find('error')
                  if bad is None:
                      continue
                  key = "%s.%s" % (tc.get('classname'), tc.get('name'))
                  if key in seen:
                      continue
                  seen.add(key)
                  msg = html.unescape(bad.get('message') or '').replace('\n', ' ')[:200]
                  print("%s: %s" % (key, msg or '(ingen beskrivning)'))
                  body = html.unescape(bad.text or '')
                  frames = [l.strip() for l in body.splitlines() if l.strip().startswith('at ')]
                  keep = [l for l in frames if not re.search(r'org\.junit|java\.base|jdk\.|org\.gradle|java\.lang\.reflect|androidx\.test\.internal', l)]
                  for l in (keep or frames)[:8]:
                      print("  " + l)
          PYTEST
          {
            echo "## Gradle build failure details"
            echo
            echo '```text'
            grep -E '(^e: | error: |FAILURE: Build failed|What went wrong:|Execution failed for task|Could not resolve|Could not find)' gradle-build.log | tail -n 50 || tail -n 80 gradle-build.log
            echo '```'
            echo
            echo "## Enhetstester"
            echo
            echo '```text'
            if [ -s /tmp/testfailures.txt ]; then
              cat /tmp/testfailures.txt
            elif [ -d "$TESTDIR" ]; then
              grep -h '<testsuite ' "$TESTDIR"/*.xml | head -n 20 || true
              echo "(inga fallerande test hittades)"
            else
              echo "Inga testresultat hittades."
            fi
            echo '```'
            echo
            echo "## Testrader ur loggen"
            echo
            echo '```text'
            grep -E 'FAILED|AssertionError|ComparisonFailure|expected:' gradle-build.log | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Korta annotations så att felen syns direkt i check-run-fliken.
          # GitHub skapar max 10 error-annoteringar per steg: lägg därför en rad
          # per fallerande test först (pythonutdraget ovan), resten av utrymmet
          # går till kompileringsfel och loggens sista rader.
          {
            head -n 10 /tmp/testfailures.txt
            grep -E '^e: ' gradle-build.log | head -n 8
            grep -E 'FAILED|AssertionError|ComparisonFailure|expected:' gradle-build.log | head -n 20
            tail -n 30 gradle-build.log
          } | awk '!seen[$0]++' | head -n 48 | while IFS= read -r line; do
            line=${line//'%'/'%25'}
            line=${line//$'\r'/'%0D'}
            echo "::error title=Gradle diagnostic::$line"
          done

      - name: Visa lintfel som annotations
        if: failure()
        run: |
          python3 - <<'PYLINT'
          import os
          import xml.etree.ElementTree as ET
          path = "app/build/reports/lint-results-debug.xml"
          if os.path.exists(path):
              for issue in ET.parse(path).getroot().findall("issue"):
                  if issue.get("severity") not in ("Error", "Fatal"):
                      continue
                  message = issue.get("message", "").replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D")
                  location = issue.find("location")
                  where = ""
                  if location is not None:
                      file = os.path.relpath(location.get("file", ""))
                      where = ",file=" + file + ",line=" + location.get("line", "1")
                  print("::error title=Android lint" + where + "::" + issue.get("id", "") + ": " + message)
          PYLINT

      - name: Rapportera APK-storlek
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s "$APK")
          MB=$((SIZE / 1024 / 1024))
          echo "APK: $MB MB ($SIZE byte)"
          if [ "$SIZE" -gt 41943040 ]; then
            echo "::warning title=APK över 40 MB::APK:n är $MB MB. 40 MB är en tidigare projektgräns, inte en generell Android-begränsning. Bygget fortsätter."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Spara enhets- och lintresultat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-and-lint-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-debug.*
            app/schemas/**/*.json
            app/build/outputs/mapping/release/**
            gradle-build.log
          if-no-files-found: ignore
          retention-days: 14
