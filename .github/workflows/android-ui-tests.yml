name: Android UI tests

# Instrumenterade tester kräver en emulator och tar därför längre tid än enhetsjobbet.
# De körs bara när appkoden ändras, inte för dokumentationsändringar.
on:
  push:
    paths:
      - "app/src/**"
      - "app/build.gradle.kts"
      - "app/proguard-rules.pro"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/android-ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    name: Compose-tester på emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK-paket (plattform, byggverktyg, emulator)
        # Sedan API 37 publiceras plattformarna med minor-suffix (android-37.0).
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" "emulator"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Kör de instrumenterade testerna
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Skriptet körs med sh (dash), så håll det till vanlig POSIX-syntax:
          # det finns inget pipefail här. Loggen sparas för felsteget nedan.
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace --console=plain > ui-tests.log 2>&1
            STATUS=$?
            tail -n 120 ui-tests.log
            exit $STATUS

      - name: Sammanfatta fel
        if: failure()
        run: |
          {
            echo "## Instrumenterade tester"
            echo
            echo '```text'
            if [ -f ui-tests.log ]; then
              grep -E 'FAILED|AssertionError|ComparisonFailure|Expected|Failed to|error:|^e: ' ui-tests.log | head -n 60 || true
            else
              echo "Ingen ui-tests.log – jobbet föll innan Gradle hann köra (t.ex. emulatorn startade inte)."
            fi
            echo '```'
            echo
            echo "## Testresultat"
            echo
            echo '```text'
            find app/build -name "TEST-*.xml" -path "*androidTest*" -print 2>/dev/null | while read -r file; do
              echo "--- $file"
              grep -E '<testcase|<failure' "$file" | head -n 30 || true
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            if [ -f ui-tests.log ]; then
              grep -E '^e: |FAILED|AssertionError|ComparisonFailure|Expected' ui-tests.log | head -n 10
            else
              echo "Instrumenterade tester: ingen loggfil skapades (emulatorn eller skriptet föll tidigt)"
            fi
            find app/build -name "TEST-*.xml" -path "*androidTest*" -print 2>/dev/null | while read -r file; do
              grep -h -B1 '<failure' "$file" | head -n 10 || true
            done
            # Loggens slut fångar konfigurations-/resolveringsfel som inte matchar ovan.
            if [ -f ui-tests.log ]; then
              tail -n 25 ui-tests.log
            fi
          } | awk '!seen[$0]++' | head -n 40 | while IFS= read -r line; do
            line=${line//'%'/'%25'}
            line=${line//$'\r'/'%0D'}
            echo "::error title=Instrumenterat test::$line"
          done

      - name: Spara testrapporten
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14
