# Håller Gradle-beroenden och GitHub-actions uppdaterade med små, granskningsbara PR:er.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Kotlin compiler plugins must be upgraded together, never Kotlin alone.
    groups:
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "Beroenden"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "Actions"
